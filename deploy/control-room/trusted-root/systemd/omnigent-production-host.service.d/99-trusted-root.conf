[Service]

# Control Room trusted-agent mode. This drop-in is intentionally scoped to O2.
# It is not installed by generic Omnigent deployments.
EnvironmentFile=/etc/omnigent-production/trusted-root.env
Environment="OMNIGENT_TRUSTED_ROOT_ACCESS=true"

# Permit the trusted agent and its child processes to acquire UID 0 through
# the host's explicitly provisioned passwordless sudo rule.
NoNewPrivileges=no
RestrictSUIDSGID=no
PrivateUsers=no

# Do not filesystem-sandbox root administration.
ProtectSystem=no
ProtectHome=no
PrivateTmp=no
PrivateDevices=no
ProtectKernelTunables=no
ProtectKernelModules=no
ProtectKernelLogs=no
ProtectControlGroups=no
ProtectClock=no
ProtectHostname=no
PrivateMounts=no

# Do not impose namespace, personality, realtime, or W^X restrictions on
# authorized root administration.
RestrictNamespaces=no
RestrictRealtime=no
LockPersonality=no
MemoryDenyWriteExecute=no

# Reset inherited syscall, address-family, filesystem, and capability limits.
# Empty SystemCallArchitectures is deliberate: it clears the native-only
# setting from the O2 base unit that previously enabled systemd seccomp plus
# NoNewPrivs=1.
SystemCallFilter=
SystemCallArchitectures=
SystemCallErrorNumber=
CapabilityBoundingSet=~
AmbientCapabilities=
RestrictAddressFamilies=
RestrictFileSystems=
