providers:
  omniroute:
    kind: gateway
    default: [openai, pi]
    openai:
      base_url: http://127.0.0.1:20128/v1
      api_key_ref: env:OMNIROUTE_API_KEY
      wire_api: chat
      models:
        default: custom/best-coding
        gpt56_sol: codex/gpt-5.6-sol
        gpt56_terra: codex/gpt-5.6-terra
        gpt56_luna: codex/gpt-5.6-luna
harness:
  default: pi
  pi:
    command: /opt/omnigent/pi/node_modules/.bin/pi
