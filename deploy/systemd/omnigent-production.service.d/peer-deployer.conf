[Service]
# Pin the production server/host units' PID1 cgroup so the root-owned
# peer-deployer can prove an authenticated O2 caller is the canonical
# systemd unit (not just "any process owned by hermes").
#
# We do NOT restart the unit here.  The runtime contract is that the
# service's existing cgroup already identifies it; the LoadCredential
# block below is what the root service consumes via its own credential
# directory.  If you ever switch O2 to a different unit name, edit this
# drop-in AND the CGROUP_UNITS allow-list in
# deploy/scripts/peer_deployer/service.py together.
SupplementaryGroups=