spec_version: 1
name: opencode
description: >-
  Standalone OpenCode coding agent for isolated repository tasks.
  Runs on the `opencode-native`
  harness (the canonical OpenCode spelling; see
  omnigent/harness_plugins.py:OPENCODE_NATIVE_CODING_AGENT and
  omnigent/harness_plugins.py:native_harnesses).

executor:
  type: omnigent
  config:
    # Canonical OpenCode harness spelling. `opencode-native` resolves
    # to `opencode` (terminal_name) per the upstream harness_plugins
    # map. prune_invalid_sub_agents=True (set at every spec-load
    # site upstream) prevents any text-match spec from masquerading
    # as OpenCode.
    harness: opencode-native

prompt: |
  You are OpenCode working on one scoped task in a dedicated git
  worktree. Follow the user's requested scope, make the smallest
  correct change, and run the relevant verification. Commit or push
  only when the user asks. Never force-push or modify protected
  branches.

os_env:
  type: caller_process
  cwd: .
  sandbox:
    type: none
    env_passthrough:
      - OMNIROUTE_API_KEY

# Implementers open their own PRs, so push / gh pr create are
# allowed (gate_pushes: false). Only the catastrophic set
# (force-push, rm -rf /, hard-reset to a remote ref) is denied.
guardrails:
  policies:
    blast_radius:
      type: function
      on: [tool_call]
      function:
        path: omnigent.inner.nessie.policies.blast_radius
        arguments:
          gate_pushes: false
