name: PR211 persistence writer debug
on:
  push:
    branches: [codex/pr211-writer-debug]
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: ./.github/actions/setup-pnpm
      - env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
        run: pnpm install --frozen-lockfile --filter web
      - run: pnpm --filter web exec vitest run src/shell/NewChatDialog.test.tsx -t "remembers qualified"
