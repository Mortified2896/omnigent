name: PR211 bounded source correction
# Temporary task-only editing/validation harness; remove before merge.
on:
  push:
    branches: [codex/fix-advisor-native-composer]
    paths: [.github/workflows/pr211-edit.yml]
permissions:
  contents: read
jobs:
  correct:
    if: github.repository == 'Mortified2896/omnigent'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      source: ${{ steps.push.outputs.source }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Apply exact reviewed fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          edits = {
            'web/src/pages/ChatPage.tsx': ('ebf751b80b2f4e02d42b93d134052a0167912ca6', [
              ('return values.map((value) => ({\n      value,\n      label: formatStatusEffortLabel(value) ?? value,', 'return values.map((effort) => ({\n      value: effort,\n      label: formatStatusEffortLabel(effort) ?? effort,')]),
            'web/src/model-advisor/NewChatAdvisorSection.tsx': ('4e7e1c0485e5ff50fd2e6b73facf7768967feda3', [
              ('const recommenderControls = editor.draft?.enabled ? (', 'const recommenderControls = editor.draft && (editor.draft.enabled || settingsOpen) ? ('),
              ('className="col-span-2 grid w-full min-w-0 grid-cols-subgrid items-center gap-1 md:flex md:basis-full md:flex-wrap"', 'className="flex w-full min-w-0 flex-col gap-1 md:flex-row md:flex-wrap md:items-center"'),
              ('<div className="grid min-w-0 grid-cols-[minmax(0,1fr)_5.5rem] items-center gap-1 md:flex md:shrink-0">', '<div className="grid w-full min-w-0 grid-cols-[minmax(0,1fr)_5.5rem] items-center gap-1 md:flex md:w-auto md:shrink-0">')]),
          }
          for path, (sha, pairs) in edits.items():
              if subprocess.check_output(['git','hash-object',path],text=True).strip() != sha:
                  raise SystemExit('Source changed; refusing overwrite: ' + path)
              p = Path(path)
              s = p.read_text()
              for before, after in pairs:
                  if s.count(before) != 1:
                      raise SystemExit('Unexpected edit count: ' + path)
                  s = s.replace(before, after)
              p.write_text(s)
          PY
          npx --yes --package prettier@3.9.5 prettier --write web/src/pages/ChatPage.tsx web/src/model-advisor/NewChatAdvisorSection.tsx
          git diff --check
      - name: Push exact paths to unchanged task branch
        id: push
        env:
          PUSH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          remote="https://x-access-token:${PUSH_TOKEN}@github.com/Mortified2896/omnigent.git"
          branch='refs/heads/codex/fix-advisor-native-composer'
          test "$(git ls-remote "$remote" "$branch" | cut -f1)" = "$EXPECTED_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- web/src/pages/ChatPage.tsx web/src/model-advisor/NewChatAdvisorSection.tsx
          git commit -m 'fix(web): keep recommender settings usable while disabled and remove shadowed effort variable'
          git push "$remote" "HEAD:$branch"
          echo "source=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  verify:
    name: Focused composer browser and component validation
    needs: correct
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright/python:v1.60.0-noble@sha256:8ff591d613b01c884cc488339ed4318b4513eaf0c57a164a878ba49e70e3f384
    defaults:
      run:
        shell: bash
    env:
      OMNIGENT_SKIP_WEB_UI: 'true'
      OMNIGENT_PW_NO_SANDBOX: '1'
      UV_PYTHON_PREFERENCE: only-system
      UV_INDEX_URL: https://pypi.org/simple
      TERM: xterm-256color
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ needs.correct.outputs.source }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.15.1
          standalone: true
      - uses: omnigent-ai/omnigent/.github/actions/setup-uv@25521b2eb074b11ebe51fe5e3eaeb494e20101eb
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: |
          uv sync --locked --extra all --group test
          pnpm install --frozen-lockfile --filter web
          mkdir -p /tmp/pr211-evidence
          git -c safe.directory="$PWD" rev-parse HEAD > /tmp/pr211-evidence/source-sha.txt
      - name: Frontend formatting, lint and type checks
        run: |
          pnpm --filter web run format:check
          pnpm --filter web run lint
          pnpm --filter web run type-check
      - name: Component regressions
        run: |
          pnpm --dir web exec vitest run src/components/composer/ComposerControls.test.tsx src/model-advisor/NewChatAdvisorSection.test.tsx src/pages/ChatPage.composer.test.tsx src/shell/NewChatDialog.test.tsx src/shell/NewChatDialog.flow.test.tsx
      - name: Build production frontend
        run: pnpm --filter web run build
      - name: Focused real-browser regressions without retries
        run: |
          uv run pytest tests/e2e_ui/chat/test_codex_model_metadata.py tests/e2e_ui/start_session/test_composer_transition.py tests/e2e_ui/start_session/test_model_advisor_composer.py tests/e2e_ui/start_session/test_picker_loading.py -v --tb=short -p no:rerunfailures --ui-skip-build --junitxml=/tmp/pr211-evidence/junit.xml --tracing=retain-on-failure --screenshot=only-on-failure
      - name: Preserve exact evidence and screenshots
        if: always()
        run: |
          mkdir -p /tmp/pr211-evidence/rendered
          git -c safe.directory="$PWD" rev-parse HEAD > /tmp/pr211-evidence/source-sha.txt
          find /tmp/pytest-of-root -type f -name '*.png' -exec cp --parents '{}' /tmp/pr211-evidence/rendered/ \; 2>/dev/null || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: pr211-focused-validation
          path: |
            /tmp/pr211-evidence/
            test-results/
          if-no-files-found: error
          retention-days: 3
