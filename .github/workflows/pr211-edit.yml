name: PR211 bounded source correction
# Temporary task-branch diagnostic bridge; remove before merge.
on:
  push:
    branches: [codex/fix-advisor-native-composer]
    paths: [.github/workflows/pr211-edit.yml]
permissions:
  contents: read
jobs:
  source:
    if: github.repository == 'Mortified2896/omnigent'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Archive only committed source, never runtime state
        run: |
          git rev-parse HEAD > "$RUNNER_TEMP/pr211-source-sha.txt"
          git archive --format=tar.gz -o "$RUNNER_TEMP/pr211-source.tgz" HEAD
          git ls-tree -r --name-only HEAD | grep -E 'tests/e2e_ui/.*(modal|reconnect|model_advisor|codex_model_metadata)'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr211-source
          path: |
            ${{ runner.temp }}/pr211-source.tgz
            ${{ runner.temp }}/pr211-source-sha.txt
          if-no-files-found: error
          retention-days: 1
