name: Control Room forward-port Pi picker

on:
  push:
    branches:
      - feat/upstream-0.9-inline-model-picker

permissions:
  contents: write

jobs:
  forward-port:
    if: ${{ !contains(github.event.head_commit.message, '[forward-port-result]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/upstream-0.9-inline-model-picker

      - name: Verify exact upstream PR head and fetch patch
        id: patch
        shell: bash
        run: |
          set -u
          EXPECTED='2f4fc8c3cceb476424d8aeb23f65bb8159308131'
          ACTUAL="$(curl -fsSL https://api.github.com/repos/omnigent-ai/omnigent/pulls/3481 | jq -r '.head.sha')"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            printf 'status=blocked\nreason=upstream head moved\nexpected=%s\nactual=%s\n' "$EXPECTED" "$ACTUAL" > /tmp/result.txt
            echo 'ok=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! curl -fsSL https://github.com/omnigent-ai/omnigent/pull/3481.patch -o /tmp/upstream-3481.patch; then
            printf 'status=blocked\nreason=patch download failed\n' > /tmp/result.txt
            echo 'ok=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git apply --check /tmp/upstream-3481.patch 2>/tmp/apply-check.err; then
            printf 'status=ready\nupstream_head=%s\n' "$ACTUAL" > /tmp/result.txt
            echo 'ok=true' >> "$GITHUB_OUTPUT"
          else
            printf 'status=blocked\nreason=git apply --check failed\nupstream_head=%s\n\n' "$ACTUAL" > /tmp/result.txt
            sed -n '1,120p' /tmp/apply-check.err >> /tmp/result.txt
            echo 'ok=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Apply upstream patch and retire superseded prototype
        if: steps.patch.outputs.ok == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git apply /tmp/upstream-3481.patch
          rm -f omnigent/prelaunch_model_options.py tests/test_prelaunch_model_options.py
          git diff --check

      - name: Commit result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ "${{ steps.patch.outputs.ok }}" = 'true' ]; then
            rm -f .control-room-forward-port-status.txt
            git add -A
            git commit -m 'feat(pi): forward-port upstream #3481 onto Control Room 0.9 [forward-port-result]'
          else
            cp /tmp/result.txt .control-room-forward-port-status.txt
            git add .control-room-forward-port-status.txt
            git commit -m 'chore(pi): record upstream #3481 forward-port blocker [forward-port-result]'
          fi
          git push origin HEAD:feat/upstream-0.9-inline-model-picker
