name: Merge Ready

# Aggregate CI status paired with the separate Maintainer Approval check.
# PR workflow runs and scoped requests own the fail-closed status lifecycle.
# `/merge` records one-way intent; only a current green lifecycle may act on it.
#
# Removing `automerge` prevents new enable attempts but does not disable an
# auto-merge already queued in GitHub.

on:
  workflow_run:
    workflows:
      - CI
      - Lint
      - Security Scan
      - Docker build
      - web Tests
      - E2E UI Tests
      - E2E Tests
      - Integration Tests
      - UI Snapshot
    # requested invalidates initial runs before a runner starts; in_progress is
    # also required because GitHub does not emit requested for reruns.
    types: [requested, in_progress, completed]
  issue_comment:
    types: [created]
  # GITHUB_TOKEN label changes do not emit pull_request:labeled workflow runs.
  # The authorized command emits this exact-head reconciliation request instead.
  repository_dispatch:
    types: [merge-ready-request]
  # Manual diagnostics evaluate one PR but never write Merge Ready or merge.
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to (re)evaluate.
        required: true
        type: string
      sha:
        description: Head SHA to evaluate (defaults to the PR's current head).
        required: false
        type: string

permissions:
  contents: read

jobs:
  command:
    name: command
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request != null &&
      contains(github.event.comment.body, '/merge') &&
      !endsWith(github.actor, '[bot]') &&
      (
        github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR'
      )
    permissions:
      contents: write       # create repository_dispatch
      issues: write         # add the label and post replies
      pull-requests: read   # resolve the current PR head
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out command scripts
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: main
          sparse-checkout: .github/scripts/merge-ready
          persist-credentials: false

      - name: Resolve /merge request
        id: ctx
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          PR: ${{ github.event.issue.number }}
        run: |
          # contains() also fires on incidental mentions; require an exact
          # command as the first non-space token on a line.
          if ! grep -qE '^[[:space:]]*/merge([[:space:]]|$)' <<<"$COMMENT_BODY"; then
            echo "::notice::Skipped: comment mentions '/merge' but not as a command"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! [[ "$PR" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Issue comment payload did not contain a PR number"
            exit 1
          fi
          SHA=$(gh pr view "$PR" --repo "$REPO" --json state,headRefOid \
            --jq 'select(.state == "OPEN") | .headRefOid')
          if ! [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::PR #$PR is not open at a full head SHA"
            exit 1
          fi
          echo "pr=$PR" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Authorize /merge commenter
        id: authz
        if: steps.ctx.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          AUTHOR: ${{ github.event.comment.user.login }}
          PR: ${{ steps.ctx.outputs.pr }}
        run: bash .github/scripts/merge-ready/authorize-merge-comment.sh

      - name: Record /merge intent and request reconciliation
        if: >-
          steps.ctx.outputs.skip != 'true' &&
          steps.authz.outputs.authorized == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.ctx.outputs.pr }}
          SHA: ${{ steps.ctx.outputs.sha }}
          AUTHOR: ${{ github.event.comment.user.login }}
        run: bash .github/scripts/merge-ready/enable-automerge-comment.sh

  prepare_dispatch:
    name: prepare dispatch
    if: >-
      github.event_name == 'repository_dispatch' &&
      github.event.action == 'merge-ready-request'
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      pr: ${{ steps.payload.outputs.pr }}
      sha: ${{ steps.payload.outputs.sha }}
    steps:
      - name: Validate reconciliation payload
        id: payload
        env:
          REQUEST_PR: ${{ github.event.client_payload.pr }}
          REQUEST_SHA: ${{ github.event.client_payload.sha }}
        run: |
          if ! [[ "$REQUEST_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::merge-ready-request requires a full 40-hex SHA"
            exit 1
          fi
          SHA="${REQUEST_SHA,,}"
          PR=""
          if [[ "$REQUEST_PR" =~ ^[1-9][0-9]*$ ]]; then
            PR="$REQUEST_PR"
          else
            echo "::warning::Request PR is absent or invalid; status will reconcile without merge"
          fi
          echo "pr=$PR" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  evaluate:
    name: evaluate
    needs: prepare_dispatch
    if: >-
      always() &&
      (
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.event == 'pull_request'
        ) ||
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'repository_dispatch' &&
          github.event.action == 'merge-ready-request' &&
          needs.prepare_dispatch.result == 'success'
        )
      )
    permissions:
      contents: write       # queue exact-head auto-merge after a green gate
      pull-requests: write  # inspect PRs and enable auto-merge
      issues: read          # exact-SHA open-PR search
      checks: read
      actions: read         # correlate required checks with PR workflow runs
      statuses: write
    concurrency:
      # Only validated dispatches and PR workflow runs share a SHA writer slot.
      # Manual diagnostics are unique and non-PR workflow runs skip this job.
      group: >-
        merge-ready-status-${{
        (github.event_name == 'workflow_run' &&
        github.event.workflow_run.head_sha) ||
        (github.event_name == 'repository_dispatch' &&
        needs.prepare_dispatch.outputs.sha) ||
        format('{0}-{1}', github.event_name, github.run_id) }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Every status writer blocks before checkout. A workflow event only
      # finishes when its source run's current API state is completed.
      - name: Start Merge Ready status lifecycle
        id: lifecycle
        if: >-
          github.event_name == 'workflow_run' ||
          github.event_name == 'repository_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || needs.prepare_dispatch.outputs.sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          STATE: pending
          DESC: Required checks are being evaluated
        run: |
          gh api --method POST "repos/$REPO/statuses/$SHA" \
            -f state="$STATE" \
            -f context="Merge Ready" \
            -f description="$DESC" >/dev/null
          echo "Posted Merge Ready=$STATE on $SHA ($DESC)"

          terminal=true
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            terminal=false
            if SOURCE_STATUS=$(gh api "repos/$REPO/actions/runs/$RUN_ID" \
              --jq '.status' 2>/dev/null); then
              if [[ "$SOURCE_STATUS" == "completed" ]]; then
                terminal=true
                echo "::notice::Source run $RUN_ID is completed; restoring final status"
              else
                echo "::notice::Source run $RUN_ID remains $SOURCE_STATUS; pending is authoritative"
              fi
            else
              echo "::warning::Could not refresh source run $RUN_ID; pending is authoritative"
            fi
          fi
          echo "terminal=$terminal" >> "$GITHUB_OUTPUT"

      - name: Check out scripts
        if: >-
          github.event_name == 'workflow_dispatch' ||
          steps.lifecycle.outputs.terminal == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: main
          sparse-checkout: .github/scripts/merge-ready
          persist-credentials: false

      - name: Resolve PR + head SHA
        id: ctx
        if: >-
          github.event_name == 'workflow_dispatch' ||
          steps.lifecycle.outputs.terminal == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_INPUT: ${{ inputs.pr }}
          SHA_INPUT: ${{ inputs.sha }}
          REQUEST_PR: ${{ needs.prepare_dispatch.outputs.pr }}
          REQUEST_SHA: ${{ needs.prepare_dispatch.outputs.sha }}
        run: |
          if [[ "${{ github.event_name }}" == "repository_dispatch" ]]; then
            PR="$REQUEST_PR"
            SHA="$REQUEST_SHA"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if ! [[ "$PR_INPUT" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::workflow_dispatch input 'pr' must be a PR number"
              exit 1
            fi
            PR="$PR_INPUT"
            if [[ "$SHA_INPUT" =~ ^[0-9a-f]{7,40}$ ]]; then
              SHA="$SHA_INPUT"
            else
              SHA=$(gh pr view "$PR" --repo "$REPO" --json headRefOid --jq '.headRefOid')
            fi
          else
            # The workflow payload SHA is cross-fork-safe and independent of PR lookup.
            PR=""
            SHA="${{ github.event.workflow_run.head_sha }}"
          fi
          echo "pr=$PR" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Evaluate required checks
        id: eval
        if: >-
          steps.ctx.outputs.skip != 'true' &&
          (
            github.event_name == 'workflow_dispatch' ||
            steps.lifecycle.outputs.terminal == 'true'
          )
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.ctx.outputs.sha }}
        run: bash .github/scripts/merge-ready/evaluate-checks.sh

      - name: Compute gate outcome
        id: gate
        if: >-
          steps.ctx.outputs.skip != 'true' &&
          (
            github.event_name == 'workflow_dispatch' ||
            steps.lifecycle.outputs.terminal == 'true'
          )
        env:
          EVAL: ${{ steps.eval.outcome }}
          FAILED: ${{ steps.eval.outputs.failed }}
        run: bash .github/scripts/merge-ready/compute-gate.sh

      - name: Post Merge Ready status on PR head SHA
        if: >-
          steps.ctx.outputs.skip != 'true' &&
          steps.lifecycle.outputs.terminal == 'true' &&
          (
            github.event_name == 'workflow_run' ||
            github.event_name == 'repository_dispatch'
          )
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.ctx.outputs.sha }}
          STATE: ${{ steps.gate.outputs.state }}
          DESC: ${{ steps.gate.outputs.short_desc }}
        run: |
          gh api --method POST "repos/$REPO/statuses/$SHA" \
            -f state="$STATE" \
            -f context="Merge Ready" \
            -f description="$DESC" >/dev/null
          echo "Posted Merge Ready=$STATE on $SHA ($DESC)"

      # Search by SHA because commit-pulls can omit cross-fork PRs. Every search
      # hit is re-read, and any lookup error or non-unique exact match fails closed.
      - name: Resolve green automerge intent
        id: intent
        if: >-
          steps.ctx.outputs.skip != 'true' &&
          steps.lifecycle.outputs.terminal == 'true' &&
          steps.gate.outputs.state == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          REQUEST_PR: ${{ needs.prepare_dispatch.outputs.pr }}
          SHA: ${{ steps.ctx.outputs.sha }}
        run: |
          echo "eligible=false" >> "$GITHUB_OUTPUT"
          if ! SEARCH_OUT=$(gh api --method GET --paginate search/issues \
            -f "q=repo:$REPO type:pr state:open sha:$SHA" \
            -f per_page=100 --jq '.items[].number' 2>/dev/null); then
            echo "::warning::Could not search open PRs for $SHA; auto-merge was not enabled"
            exit 0
          fi

          mapfile -t CANDIDATES < <(printf '%s\n' "$SEARCH_OUT" | sed '/^$/d')
          MATCHES=()
          MATCH_LABELS=()
          for CANDIDATE in "${CANDIDATES[@]}"; do
            if ! [[ "$CANDIDATE" =~ ^[1-9][0-9]*$ ]]; then
              echo "::warning::PR search returned an invalid number; auto-merge was not enabled"
              exit 0
            fi
            if ! PR_JSON=$(gh pr view "$CANDIDATE" --repo "$REPO" \
              --json state,headRefOid,labels 2>/dev/null); then
              echo "::warning::Could not verify PR #$CANDIDATE; auto-merge was not enabled"
              exit 0
            fi
            if ! STATE=$(jq -er '.state' <<<"$PR_JSON") ||
               ! HEAD=$(jq -er '.headRefOid' <<<"$PR_JSON"); then
              echo "::warning::PR #$CANDIDATE returned invalid data; auto-merge was not enabled"
              exit 0
            fi
            if [[ "$STATE" == "OPEN" && "$HEAD" == "$SHA" ]]; then
              MATCHES+=("$CANDIDATE")
              if jq -e 'any(.labels[]?; .name == "automerge")' \
                <<<"$PR_JSON" >/dev/null; then
                MATCH_LABELS+=(true)
              else
                MATCH_LABELS+=(false)
              fi
            fi
          done

          if [[ ${#MATCHES[@]} -ne 1 ]]; then
            echo "::warning::Expected one open PR at $SHA, found ${#MATCHES[@]}; auto-merge was not enabled"
            exit 0
          fi
          PR="${MATCHES[0]}"
          if [[ "$EVENT_NAME" == "repository_dispatch" && "$REQUEST_PR" != "$PR" ]]; then
            echo "::warning::Request PR does not match the unique PR at $SHA; auto-merge was not enabled"
            exit 0
          fi
          if [[ "${MATCH_LABELS[0]}" != "true" ]]; then
            echo "::notice::PR #$PR has no 'automerge' intent; no new enable attempt was made"
            exit 0
          fi
          echo "pr=$PR" >> "$GITHUB_OUTPUT"
          echo "eligible=true" >> "$GITHUB_OUTPUT"

      - name: Enable auto-merge for green intent
        if: >-
          steps.lifecycle.outputs.terminal == 'true' &&
          steps.gate.outputs.state == 'success' &&
          steps.intent.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.intent.outputs.pr }}
          SHA: ${{ steps.ctx.outputs.sha }}
        run: bash .github/scripts/merge-ready/enable-automerge-label.sh

      - name: Fail job when gate is red
        if: >-
          steps.ctx.outputs.skip != 'true' &&
          (
            github.event_name == 'workflow_dispatch' ||
            steps.lifecycle.outputs.terminal == 'true'
          ) &&
          steps.gate.outputs.state == 'failure'
        run: |
          echo "::error::Merge Ready gate is red for SHA ${{ steps.ctx.outputs.sha }}"
          exit 1
