name: Control Room materialize Pi forward-port rejects

on:
  push:
    branches:
      - integration/pi-3481-forward-port-work

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, '[forward-port-work]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out integration branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: integration/pi-3481-forward-port-work

      - name: Verify exact upstream head and fetch patch
        run: |
          set -euo pipefail
          EXPECTED='2f4fc8c3cceb476424d8aeb23f65bb8159308131'
          ACTUAL="$(curl -fsSL https://api.github.com/repos/omnigent-ai/omnigent/pulls/3481 | jq -r '.head.sha')"
          test "$ACTUAL" = "$EXPECTED"
          curl -fsSL https://github.com/omnigent-ai/omnigent/pull/3481.patch -o /tmp/upstream-3481.patch
          test -s /tmp/upstream-3481.patch

      - name: Apply every clean hunk and preserve rejects
        shell: bash
        run: |
          set -u
          git apply --reject --whitespace=nowarn /tmp/upstream-3481.patch || true
          rm -f omnigent/prelaunch_model_options.py tests/test_prelaunch_model_options.py
          {
            echo 'Upstream PR #3481 partial forward-port materialized.'
            echo 'Exact upstream head: 2f4fc8c3cceb476424d8aeb23f65bb8159308131'
            echo
            echo 'Reject files:'
            find . -name '*.rej' -print | sort
          } > .control-room-forward-port-work.txt

      - name: Commit materialized work
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore(pi): materialize upstream #3481 rejects [forward-port-work]'
          git push origin HEAD:integration/pi-3481-forward-port-work
